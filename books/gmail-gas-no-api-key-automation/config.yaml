title: "GASだけでGmailを自動化する ── APIキー不要・無料で動く4本と定期実行の落とし穴"
summary: "Google Apps Script（GAS）だけで、Gmailの定番の面倒ごとを自動化する無料の本です。OpenAIなどのAPIキーも追加費用も不要。送信元ごとの自動ラベル分け（ルールはスプレッドシートで管理）、古いメールの自動削除・アーカイブ（お試しモード・スター保護）、新着メールのSlack／Google Chat通知（二重通知なし）、受信メールのスプレッドシート書き出し（重複なし・数式注入対策）を、コピペで動くコード全文つきで解説します。最後に、複数のスクリプトを1つのプロジェクトで動かすときの定数名の衝突やトリガーの重複の防ぎ方をまとめています。"
