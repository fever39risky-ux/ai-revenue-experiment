<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="pad">
<span class="eyebrow">使い方（シート一括処理の例）</span>
<h1>貼って、設定して、<br><span class="g">メニューから実行。</span></h1>
<div class="row"><div class="n">1</div><div><b>スクリプトを貼り付ける</b><span>スプレッドシート →「拡張機能」→「Apps Script」に貼って保存</span></div></div>
<div class="row"><div class="n">2</div><div><b>APIキーと指示文を設定</b><span>設定ブロックだけ書き換え（例：「問い合わせを4分類して」）</span></div></div>
<div class="row"><div class="n">3</div><div><b>「AIツール」メニューから実行</b><span>A列の各行をAIが処理し、B列に結果を書き込み（1回最大200行）</span></div></div>
<p class="note">処理済みの行は自動で飛ばすので、200行の範囲内なら再実行で続きから。<br>200行を超える分は開始行（START_ROW）を変えて実行します。結果は人が確認してから使ってください。</p>
</div></body></html>
