<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0a141b}
  html,body{width:1220px;height:1016px;overflow:hidden}
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","IPAexGothic","Noto Sans CJK JP",sans-serif;
    color:#eaf3f7;position:relative;overflow:hidden;
    background:radial-gradient(1100px 700px at 80% -12%,rgba(47,143,136,.42),transparent),
               linear-gradient(158deg,#0f1e26,#0a141b);}
  .pad{position:absolute;inset:0;padding:70px 72px;display:flex;flex-direction:column}
  .eyebrow{display:inline-block;align-self:flex-start;font-size:30px;font-weight:800;letter-spacing:.06em;
    color:#8fe6df;border:3px solid #2f6b66;border-radius:999px;padding:10px 26px;margin-bottom:34px}
  h1{font-size:84px;line-height:1.2;font-weight:900;letter-spacing:-.01em}
  h1 .g{background:linear-gradient(90deg,#4fd0c8,#6ea8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:34px;color:#b9cbd6;margin-top:30px;font-weight:600;line-height:1.55}
  .ba{display:flex;gap:22px;margin-top:50px;align-items:stretch}
  .box{flex:1;border-radius:18px;padding:22px 26px;border:3px solid #26424f;background:rgba(18,30,39,.72)}
  .box .lab{font-size:26px;font-weight:800;margin-bottom:10px}
  .before .lab{color:#ff9d9d}.after .lab{color:#6ee7b0}
  .box .t{font-size:32px;line-height:1.4;color:#dbe7ef;font-weight:700}
  .arrow{align-self:center;font-size:60px;font-weight:900;color:#4fd0c8}
</style></head><body>
  <div class="pad">
    <span class="eyebrow">ChatGPT × スプレッドシート 自動化</span>
    <h1>「毎回AIに貼る」を、<br><span class="g">そのまま動くGAS2本</span><br>で減らす。</h1>
    <div class="sub">読むだけで終わらない、動くスクリプトを納品。<br>コードを書く必要なし／日本語の導入手順書つき。</div>
    <div class="ba">
      <div class="box before"><div class="lab">BEFORE</div><div class="t">1行ずつ<br>手作業でコピペ…</div></div>
      <div class="arrow">→</div>
      <div class="box after"><div class="lab">AFTER</div><div class="t">メニューから<br>1回実行で一括処理</div></div>
    </div>
  </div>
</body></html>
