<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0a141b}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{font-family:"IPAexGothic","IPAGothic","IPAPGothic","Noto Sans CJK JP",sans-serif;
    color:#eaf3f7;position:relative;overflow:hidden;
    background:radial-gradient(1100px 620px at 78% -12%,rgba(47,143,136,.42),transparent),
               linear-gradient(158deg,#0f1e26,#0a141b);}
  .pad{position:absolute;inset:0;padding:46px 64px 46px;display:flex;flex-direction:column}
  .eyebrow{display:inline-block;align-self:flex-start;font-size:22px;font-weight:800;letter-spacing:.06em;
    color:#8fe6df;border:2px solid #2f6b66;border-radius:999px;padding:8px 20px;margin-bottom:20px}
  h1{font-size:66px;line-height:1.14;font-weight:900;letter-spacing:-.01em}
  h1 .g{background:linear-gradient(90deg,#4fd0c8,#6ea8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:27px;color:#b9cbd6;margin-top:16px;font-weight:600;line-height:1.45}
  .ba{display:flex;gap:22px;margin-top:52px;align-items:stretch}
  .box{flex:1;border-radius:16px;padding:18px 22px;border:2px solid #26424f;background:rgba(18,30,39,.72)}
  .box .lab{font-size:20px;font-weight:800;margin-bottom:9px}
  .before .lab{color:#ff9d9d}.after .lab{color:#6ee7b0}
  .box .t{font-size:24px;line-height:1.4;color:#dbe7ef;font-weight:600}
  .arrow{align-self:center;font-size:52px;font-weight:900;color:#4fd0c8}
  .foot{position:absolute;right:66px;bottom:60px;font-size:26px;font-weight:800;color:#0f1e26;
    background:linear-gradient(90deg,#4fd0c8,#6ea8ff);padding:14px 26px;border-radius:14px}
</style></head><body>
  <div class="pad">
    <span class="eyebrow">ChatGPT × スプレッドシート 自動化</span>
    <h1>「毎回AIに貼る」を、<br><span class="g">そのまま動くGAS2本</span>で消す。</h1>
    <div class="sub">読むだけで終わらせない。あなたの環境に“導入”します。<br>コード不要／日本語の導入手順書つき。</div>
    <div class="ba">
      <div class="box before"><div class="lab">BEFORE</div><div class="t">1行ずつ手作業でコピペ…</div></div>
      <div class="arrow">→</div>
      <div class="box after"><div class="lab">AFTER</div><div class="t">実行ボタン1回で一括処理</div></div>
    </div>
  </div>
</body></html>
