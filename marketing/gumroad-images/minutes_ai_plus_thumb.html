<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0a141b}
  html,body{width:1200px;height:1200px;overflow:hidden}
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","IPAexGothic","IPAGothic","IPAPGothic","Noto Sans CJK JP",sans-serif;
    color:#eaf3f7;position:relative;overflow:hidden;
    background:radial-gradient(900px 700px at 80% -10%,rgba(47,143,136,.45),transparent),
               linear-gradient(158deg,#0f1e26,#0a141b);}
  .pad{position:absolute;inset:0;padding:88px 72px;display:flex;flex-direction:column}
  .eyebrow{display:inline-block;align-self:flex-start;font-size:29px;font-weight:800;letter-spacing:.04em;
    color:#8fe6df;border:2.5px solid #2f6b66;border-radius:999px;padding:12px 26px;margin-bottom:44px}
  h1{font-size:80px;line-height:1.2;font-weight:900;letter-spacing:-.02em}
  h1 .g{background:linear-gradient(90deg,#4fd0c8,#6ea8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:38px;color:#b9cbd6;margin-top:34px;font-weight:600;line-height:1.5}
  .ba{display:flex;flex-direction:column;gap:24px;margin-top:64px}
  .box{border-radius:20px;padding:26px 30px;border:2px solid #26424f;background:rgba(18,30,39,.72);display:flex;align-items:baseline;gap:22px}
  .box .lab{font-size:28px;font-weight:800;flex:0 0 150px}
  .before .lab{color:#ff9d9d}.after .lab{color:#6ee7b0}
  .box .t{font-size:34px;line-height:1.35;color:#dbe7ef;font-weight:700}
  .foot{margin-top:auto;font-size:30px;font-weight:700;color:#9fb6c2}
</style></head><body>
  <div class="pad">
    <span class="eyebrow">Google Apps Script × ChatGPT｜拡張版</span>
    <h1>会議メモから<br><span class="g">議事録とTODOをAIが整理</span></h1>
    <div class="sub">長文の分割要約／TODO台帳／期限リマインド</div>
    <div class="ba">
      <div class="box before"><div class="lab">BEFORE</div><div class="t">会議のたびに誰が何をいつまで…を手で抜き出す</div></div>
      <div class="box after"><div class="lab">AFTER</div><div class="t">要点・決定・TODOが台帳に。期限前に自動で通知</div></div>
    </div>
    <div class="foot">貼って動くGAS1本＋日本語の導入手順</div>
  </div>
</body></html>
