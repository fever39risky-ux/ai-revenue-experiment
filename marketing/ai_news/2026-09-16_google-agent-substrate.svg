<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="58%" stop-color="#111c2c"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fc3b3"/>
      <stop offset="100%" stop-color="#67a2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="80" r="310" fill="#2e7f91" opacity="0.16" filter="url(#glow)"/>
  <rect x="0" y="0" width="1600" height="10" fill="url(#accent)"/>
  <g font-family="Noto Sans CJK JP, sans-serif">
    <rect x="86" y="66" width="166" height="52" rx="26" fill="url(#accent)"/>
    <text x="169" y="101" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">AIニュース</text>
    <text x="1514" y="101" text-anchor="end" font-size="24" fill="#8ea4b7">2026.09.16</text>
    <text x="86" y="214" font-size="64" font-weight="800" fill="#f2f6fa">AIエージェントは</text>
    <text x="86" y="296" font-size="64" font-weight="800" fill="#f2f6fa">「待機コスト」まで設計する時代へ</text>
    <g transform="translate(86,365)">
      <text x="0" y="150" font-size="164" font-weight="900" fill="#4fc3b3">10×</text>
      <text x="5" y="206" font-size="29" font-weight="600" fill="#c2d0dc">標準コンテナ比の計算密度</text>
      <text x="5" y="242" font-size="22" fill="#8297aa">※Google Cloud発表値</text>
    </g>
    <g transform="translate(720,388)" font-size="32" fill="#dbe6ef">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#4fc3b3"/>
      <text x="34" y="20">500ms未満で休止状態から再開</text>
      <rect x="0" y="84" width="14" height="14" rx="3" fill="#67a2ff"/>
      <text x="34" y="104">アイドル時はCPU・メモリを解放</text>
      <rect x="0" y="168" width="14" height="14" rx="3" fill="#4fc3b3"/>
