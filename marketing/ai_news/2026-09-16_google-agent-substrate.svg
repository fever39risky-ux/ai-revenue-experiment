    </g>
    <rect x="86" y="745" width="1428" height="1" fill="#2b3a49"/>
    <text x="86" y="798" font-size="23" fill="#9eb0bf">出典: Google Cloud · Agent Substrate available on GKE · 2026-09-15</text>
    <text x="1514" y="798" text-anchor="end" font-size="25" font-weight="700" fill="#edf3f7">@KinoshitaTsks</text>
    <text x="86" y="842" font-size="20" fill="#70869a">本番サポートは現時点でallowlist。性能値はGoogleの発表値で、ワークロードにより異なります。</text>
