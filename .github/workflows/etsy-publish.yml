name: Etsy publish
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Listing to publish: default (original $9 toolkit), invoice, bookkeeping, seller, budget, debt, rental, inventory, wedding, freelance, or bizbundle'
        required: false
        default: 'default'
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish the prepared Etsy listing (no-ops without credentials)
        env:
          ETSY_API_KEYSTRING: ${{ secrets.ETSY_API_KEYSTRING }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          ETSY_CONFIG: ${{ inputs.variant == 'invoice' && 'marketing/etsy_listing_config_invoice.json' || inputs.variant == 'bookkeeping' && 'marketing/etsy_listing_config_bookkeeping.json' || inputs.variant == 'seller' && 'marketing/etsy_listing_config_seller.json' || inputs.variant == 'budget' && 'marketing/etsy_listing_config_budget.json' || inputs.variant == 'debt' && 'marketing/etsy_listing_config_debt.json' || inputs.variant == 'rental' && 'marketing/etsy_listing_config_rental.json' || inputs.variant == 'inventory' && 'marketing/etsy_listing_config_inventory.json' || inputs.variant == 'wedding' && 'marketing/etsy_listing_config_wedding.json' || inputs.variant == 'freelance' && 'marketing/etsy_listing_config_freelance.json' || inputs.variant == 'bizbundle' && 'marketing/etsy_listing_config_bizbundle.json' || '' }}
          ETSY_STATE: ${{ inputs.variant == 'invoice' && 'status/etsy_listing_invoice.json' || inputs.variant == 'bookkeeping' && 'status/etsy_listing_bookkeeping.json' || inputs.variant == 'seller' && 'status/etsy_listing_seller.json' || inputs.variant == 'budget' && 'status/etsy_listing_budget.json' || inputs.variant == 'debt' && 'status/etsy_listing_debt.json' || inputs.variant == 'rental' && 'status/etsy_listing_rental.json' || inputs.variant == 'inventory' && 'status/etsy_listing_inventory.json' || inputs.variant == 'wedding' && 'status/etsy_listing_wedding.json' || inputs.variant == 'freelance' && 'status/etsy_listing_freelance.json' || inputs.variant == 'bizbundle' && 'status/etsy_listing_bizbundle.json' || '' }}
        run: node scripts/etsy_publish.mjs
      - name: Regenerate report + leak gate
        run: |
          node scripts/leak_check.mjs
          node scripts/gen_report.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "ai-revenue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status/ reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(etsy): publish run $(date -u +%FT%TZ)"
            git pull --rebase origin main || true
            git push
          else
            echo "no changes"
          fi
