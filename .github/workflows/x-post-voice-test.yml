name: X post voice test (one-off, single reply)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Post exactly one real-voice test reply under the pinned post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_ROOT_POST_ID: ${{ vars.X_ROOT_POST_ID }}
        run: node scripts/x_post_voice_test.mjs
      - name: Leak check before commit
        run: node scripts/leak_check.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "ai-revenue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status/x_voice_test_post_draft.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): voice test post result $(date -u +%FT%TZ)"
            git pull --rebase origin main || true
            git push
          else
            echo "no changes"
          fi
