name: Temporary media upload measurement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate public image
        run: |
          node <<'JS'
          const fs=require('fs'),crypto=require('crypto');
          (async()=>{
            if(Date.now()>Date.parse('2026-10-01T06:30:00Z'))throw Error('probe_expired');
            const r=await fetch('https://pbs.twimg.com/media/HTgzcHcXMAAIHUo?format=jpg&name=large',{redirect:'error',signal:AbortSignal.timeout(30000)});
            if(!r.ok)throw Error('image_http_'+r.status);
            const b=Buffer.from(await r.arrayBuffer());
            if(b.length!==175844||crypto.createHash('sha256').update(b).digest('hex')!=='fcbd5e25dce35dc2034327f7fede20cbe129e1e919f6cd6983c43be5ec065a44')throw Error('image_integrity_failed');
            if(b.readUInt16BE(0)!==0xffd8)throw Error('not_jpeg');
            let dims;for(let i=2;i+9<b.length;){if(b[i]!==255)throw Error('invalid_jpeg');let marker=b[i+1];i+=2;if(marker===0xd9||marker===0xda)break;const size=b.readUInt16BE(i);if(size<2)throw Error('invalid_jpeg');if([0xc0,0xc1,0xc2].includes(marker)){dims=[b.readUInt16BE(i+5),b.readUInt16BE(i+3)];break;}i+=size;}
            if(!dims||dims[0]!==1122||dims[1]!==1402)throw Error('dimensions_mismatch');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/probe-image.jpg',b,{mode:0o600});
            console.log(JSON.stringify({image_verified:true,bytes:b.length,width:dims[0],height:dims[1]}));
          })().catch(()=>{console.error('Image preflight failed; X requests=0');process.exitCode=1;});
          JS
      - name: Upload exactly once
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          node <<'JS'
          const fs=require('fs'),crypto=require('crypto');
          const result={probe:'media-once-20261001-0550-r2',run_id:process.env.GITHUB_RUN_ID,attempted_requests:0,cost_usd:null};
          (async()=>{
            if(process.env.GITHUB_RUN_ATTEMPT!=='1'||Date.now()>Date.parse('2026-10-01T06:30:00Z'))throw Error('probe_not_allowed');
            const names=['X_API_KEY','X_API_KEY_SECRET','X_ACCESS_TOKEN','X_ACCESS_TOKEN_SECRET'];if(names.some(k=>!process.env[k]))throw Error('credentials_unavailable');
            const b=fs.readFileSync(process.env.RUNNER_TEMP+'/probe-image.jpg');
            if(crypto.createHash('sha256').update(b).digest('hex')!=='fcbd5e25dce35dc2034327f7fede20cbe129e1e919f6cd6983c43be5ec065a44')throw Error('image_integrity_failed');
            const enc=s=>encodeURIComponent(s).replace(/[!*'()]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase());
            const url='https://api.x.com/2/media/upload';
            const oauth={oauth_consumer_key:process.env.X_API_KEY,oauth_token:process.env.X_ACCESS_TOKEN,oauth_signature_method:'HMAC-SHA1',oauth_timestamp:String(Math.floor(Date.now()/1000)),oauth_nonce:crypto.randomBytes(16).toString('hex'),oauth_version:'1.0'};
            const pairs=Object.entries(oauth).map(([k,v])=>[enc(k),enc(v)]).sort(([a],[b])=>a<b?-1:a>b?1:0);
            const base=['POST',enc(url),enc(pairs.map(([k,v])=>k+'='+v).join('&'))].join('&');
            oauth.oauth_signature=crypto.createHmac('sha1',enc(process.env.X_API_KEY_SECRET)+'&'+enc(process.env.X_ACCESS_TOKEN_SECRET)).update(base).digest('base64');
            const auth='OAuth '+Object.entries(oauth).map(([k,v])=>enc(k)+'="'+enc(v)+'"').join(', ');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/upload-intent.json',JSON.stringify({run_id:result.run_id,at:new Date().toISOString()}),{flag:'wx',mode:0o600});
            result.started_at=new Date().toISOString();result.attempted_requests=1;
            console.log(JSON.stringify({event:'upload_attempt',...result}));
            const r=await fetch(url,{method:'POST',redirect:'error',signal:AbortSignal.timeout(30000),headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({media:b.toString('base64'),media_category:'tweet_image'})});
            result.http_status=r.status;result.finished_at=new Date().toISOString();
            let data;try{data=await r.json();}catch{}
            if(r.ok&&typeof data?.data?.id==='string'&&/^\d+$/.test(data.data.id)){result.media_id=data.data.id;result.outcome='upload_returned_id';}else{result.outcome=r.ok?'unknown_response':'http_rejected';process.exitCode=1;}
          })().catch(()=>{result.finished_at=new Date().toISOString();result.outcome=result.attempted_requests?'result_unknown_no_retry':'stopped_before_request';process.exitCode=1;}).finally(()=>{
            console.log(JSON.stringify(result));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'```json\n'+JSON.stringify(result,null,2)+'\n```\n');
            try{fs.unlinkSync(process.env.RUNNER_TEMP+'/probe-image.jpg');}catch{}
          });
          JS
