name: Gumroad publish
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish the prepared Gumroad listing via the official REST API (no-ops without credentials)
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: node scripts/gumroad_publish.mjs
      - name: Regenerate report + leak gate
        run: |
          node scripts/leak_check.mjs
          node scripts/gen_report.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "ai-revenue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status/ reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(gumroad): publish run $(date -u +%FT%TZ)"
            git pull --rebase origin main || true
            git push
          else
            echo "no changes"
          fi
