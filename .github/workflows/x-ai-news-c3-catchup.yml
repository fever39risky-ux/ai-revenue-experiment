name: C3 single catch-up (price-held)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'One C3 stage; parent must persist each result before next'
        required: true
        type: choice
        options: [upload, post, verify]
permissions:
  contents: read
concurrency:
  group: ai-news-c3-catchup
  cancel-in-progress: false
jobs:
  c3:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      C3_STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Price hold and durable parent claim (no X Secrets)
        run: node scripts/ai-news/c3-run.mjs gate
      - name: Execute exactly one request
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/ai-news/c3-run.mjs execute
      - name: Preserve receipt even on unknown outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/c3-receipts/*.intent.json
            ${{ runner.temp }}/c3-receipts/*.result.json
          if-no-files-found: ignore
          retention-days: 30
