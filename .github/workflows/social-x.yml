name: X poster
on:
  # RESUMED 2026-09-07 (owner-approved after reviewing the real-voice test
  # post): now drives scripts/x_post_experiment_commentary.mjs, not the old
  # generic post_x.mjs queue. That script is a dumb, mechanical drain --
  # it only posts if social/x_experiment_next_post.json exists (written by
  # the daily autonomous session ONLY on a day it judges genuinely worth
  # reporting, per ops/AGENT_LOOP.md's "X posting policy" section) and
  # today hasn't already posted (social/x_experiment_history.json). A
  # quiet day with nothing queued is expected and normal, not an error.
  schedule:
    - cron: '*/30 * * * *'   # check for a queued post every 30 min; no-ops instantly if none
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'social/x_experiment_next_post.json'
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Post today's queued experiment-commentary reply, if any
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_ROOT_POST_ID: ${{ vars.X_ROOT_POST_ID }}
        run: node scripts/x_post_experiment_commentary.mjs
      - name: Leak check before commit
        run: node scripts/leak_check.mjs
      - name: Commit history/queue changes
        run: |
          git config user.name "ai-revenue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/x_experiment_history.json social/x_experiment_next_post.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): experiment-commentary post result $(date -u +%FT%TZ)"
            git pull --rebase origin main || true
            git push
          else
            echo "no social changes"
          fi
