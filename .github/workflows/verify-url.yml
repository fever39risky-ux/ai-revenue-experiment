name: verify-url
# Minimal reachability check for external URLs the operator sandbox cannot
# reach directly (e.g. zenn.dev, which is blocked by the sandbox egress policy).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to check"
        required: true
        type: string
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the URL
        run: |
          echo "Checking: ${{ inputs.url }}"
          code=$(curl -sS -m 30 -o /tmp/body -w "%{http_code}" -L "${{ inputs.url }}" || echo "000")
          title=$(grep -oiE '<title[^>]*>[^<]*</title>' /tmp/body | head -1 || true)
          # Emit the signal LAST so it is visible in a log tail.
          echo "=================================="
          echo "RESULT_URL=${{ inputs.url }}"
          echo "RESULT_TITLE=${title}"
          echo "RESULT_HTTP_STATUS=${code}"
          echo "=================================="
