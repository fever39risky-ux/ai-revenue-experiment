name: Sales monitor
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4h
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poll Stripe & update revenue ledger
        env:
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
        run: node scripts/sales_monitor.mjs
      - name: Regenerate report (Asia/Tokyo) + leak gate
        run: |
          node scripts/leak_check.mjs
          node scripts/gen_report.mjs
      - name: Queue an X post on new revenue
        run: node scripts/on_revenue_hook.mjs || true
      - name: Commit & push if changed
        run: |
          git config user.name "ai-revenue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status/ reports/ social/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(sales): stripe sync $(date -u +%FT%TZ)"
            git pull --rebase origin main || true
            git push
          else
            echo "no revenue changes"
          fi
