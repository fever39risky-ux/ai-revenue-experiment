name: Etsy deactivate listing (one-off cleanup)
on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: 'Etsy listing_id to deactivate'
        required: true
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  deactivate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deactivate the given Etsy listing
        env:
          ETSY_API_KEYSTRING: ${{ secrets.ETSY_API_KEYSTRING }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          ETSY_DEACTIVATE_LISTING_ID: ${{ github.event.inputs.listing_id }}
        run: node scripts/etsy_deactivate_listing.mjs
